[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-lib"
version = "0.1.0"
description = "Notification library with AWS SES/SNS channel strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.26.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "moto>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
